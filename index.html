<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chunakhan Rosewater Dish | Pickleball Rankings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- Header -->
  <header class="border-b border-gray-800 bg-gray-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
      <div class="flex items-center gap-3">
        <div class="bg-red-600 p-2.5 rounded-xl shadow-lg shadow-red-600/20">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-extrabold text-xl sm:text-2xl tracking-tight text-white">CHUNAKHAN ROSEWATER DISH</h1>
            <span class="bg-red-500/10 text-red-400 border border-red-500/20 text-xs font-bold px-2 py-0.5 rounded-full">Rally 21</span>
          </div>
          <p class="text-xs text-gray-400">Official Playgroup Points & Ranking System</p>
        </div>
      </div>
      <div id="syncStatus" class="text-xs font-semibold px-3 py-1.5 rounded-full bg-yellow-500/10 text-yellow-400 border border-yellow-500/20 flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-yellow-400 animate-pulse"></span> Checking Cloud...
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-6">
    <!-- Navigation Tabs -->
    <div class="flex gap-2 border-b border-gray-800 pb-3 mb-6 overflow-x-auto">
      <button onclick="switchTab('leaderboard')" id="tab-leaderboard" class="tab-btn px-4 py-2 rounded-lg font-bold text-sm bg-red-600 text-white flex items-center gap-2">🏆 Leaderboard</button>
      <button onclick="switchTab('log')" id="tab-log" class="tab-btn px-4 py-2 rounded-lg font-bold text-sm bg-gray-800/60 text-gray-400 hover:text-white flex items-center gap-2">➕ Log Match</button>
      <button onclick="switchTab('history')" id="tab-history" class="tab-btn px-4 py-2 rounded-lg font-bold text-sm bg-gray-800/60 text-gray-400 hover:text-white flex items-center gap-2">📜 History</button>
      <button onclick="switchTab('settings')" id="tab-settings" class="tab-btn px-4 py-2 rounded-lg font-bold text-sm bg-gray-800/60 text-gray-400 hover:text-white flex items-center gap-2">☁️ Live Sync</button>
    </div>

    <!-- LEADERBOARD TAB -->
    <div id="view-leaderboard" class="tab-content space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6" id="topPodium"></div>
      <div class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden shadow-xl">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-800/50 text-gray-400 text-xs uppercase tracking-wider border-b border-gray-800">
              <th class="p-4">Rank</th>
              <th class="p-4">Player</th>
              <th class="p-4 text-center">Pts</th>
              <th class="p-4 text-center">W / L</th>
              <th class="p-4 text-center">Win %</th>
            </tr>
          </thead>
          <tbody id="leaderboardBody" class="divide-y divide-gray-800/60 text-sm font-medium"></tbody>
        </table>
      </div>
    </div>

    <!-- LOG MATCH TAB -->
    <div id="view-log" class="tab-content hidden max-w-xl mx-auto">
      <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl shadow-xl space-y-5">
        <h2 class="text-lg font-bold text-white flex items-center gap-2">🏓 Log Match Result</h2>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="text-xs text-gray-400 block mb-1">Winner</label>
            <select id="winnerSelect" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white font-semibold focus:outline-none focus:border-red-500"></select>
          </div>
          <div>
            <label class="text-xs text-gray-400 block mb-1">Loser</label>
            <select id="loserSelect" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white font-semibold focus:outline-none focus:border-red-500"></select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="text-xs text-gray-400 block mb-1">Winner Score</label>
            <input type="number" id="winnerScore" value="21" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white font-semibold focus:outline-none focus:border-red-500">
          </div>
          <div>
            <label class="text-xs text-gray-400 block mb-1">Loser Score</label>
            <input type="number" id="loserScore" placeholder="e.g. 15" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white font-semibold focus:outline-none focus:border-red-500">
          </div>
        </div>
        <button onclick="submitMatch()" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition">Record Game & Update Ratings</button>
      </div>
    </div>

    <!-- MATCH HISTORY TAB -->
    <div id="view-history" class="tab-content hidden max-w-2xl mx-auto">
      <div id="historyList" class="space-y-3"></div>
    </div>

    <!-- LIVE SYNC / SETTINGS TAB -->
    <div id="view-settings" class="tab-content hidden max-w-xl mx-auto space-y-6">
      <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl shadow-xl space-y-4">
        <h2 class="text-lg font-bold text-white flex items-center gap-2">☁️ Live Shared Database Setup</h2>
        <p class="text-xs text-gray-400">Paste your Firebase configuration snippet or JSON directly below:</p>
        <textarea id="configInput" rows="6" placeholder="Paste entire firebaseConfig snippet here..." class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-xs font-mono text-gray-300 focus:outline-none focus:border-red-500"></textarea>
        <div class="flex gap-2">
          <button onclick="saveFirebaseConfig()" class="flex-1 bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-xl text-sm transition">Connect Live Sync</button>
          <button onclick="useLocalStorage()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold px-4 py-3 rounded-xl text-sm transition">Use Local Storage</button>
        </div>
      </div>
      <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl shadow-xl space-y-4">
        <h2 class="text-lg font-bold text-white flex items-center gap-2">➕ Add New Player</h2>
        <div class="flex gap-2">
          <input type="text" id="newPlayerName" placeholder="Player Name" class="flex-1 bg-gray-800 border border-gray-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-red-500">
          <button onclick="addNewPlayer()" class="bg-red-600 hover:bg-red-500 text-white font-bold px-5 py-3 rounded-xl text-sm transition">Add Player</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    let db = null;
    let players = [];
    let matches = [];

    const defaultPlayers = [
      { id: '1', name: 'Ankur', pts: 1200, w: 0, l: 0 },
      { id: '2', name: 'Alok', pts: 1200, w: 0, l: 0 },
      { id: '3', name: 'Sumit', pts: 1200, w: 0, l: 0 }
    ];

    window.onload = function() {
      const savedConfig = localStorage.getItem('cr_firebase_config');
      if (savedConfig) {
        initFirebase(JSON.parse(savedConfig));
      } else {
        useLocalStorage();
      }
    };

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(el => {
        el.classList.remove('bg-red-600', 'text-white');
        el.classList.add('bg-gray-800/60', 'text-gray-400');
      });
      document.getElementById(`view-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).classList.add('bg-red-600', 'text-white');
      document.getElementById(`tab-${tab}`).classList.remove('bg-gray-800/60', 'text-gray-400');
    }

    function parseConfig(text) {
      try { return JSON.parse(text); } catch(e) {}
      const keys = ['apiKey', 'authDomain', 'projectId', 'storageBucket', 'messagingSenderId', 'appId', 'measurementId'];
      const cfg = {};
      keys.forEach(k => {
        const match = text.match(new RegExp(`${k}\\s*:\\s*["']([^"']+)["']`));
        if (match) cfg[k] = match[1];
      });
      return cfg.apiKey ? cfg : null;
    }

    function saveFirebaseConfig() {
      const raw = document.getElementById('configInput').value.trim();
      const cfg = parseConfig(raw);
      if (!cfg) {
        alert("Could not parse config keys. Please make sure the copied snippet contains 'apiKey'.");
        return;
      }
      localStorage.setItem('cr_firebase_config', JSON.stringify(cfg));
      initFirebase(cfg);
    }

    function initFirebase(cfg) {
      try {
        if (!firebase.apps.length) firebase.initializeApp(cfg);
        db = firebase.firestore();
        document.getElementById('syncStatus').innerHTML = `<span class="w-2 h-2 rounded-full bg-green-400"></span> Live Cloud Sync`;
        document.getElementById('syncStatus').className = "text-xs font-semibold px-3 py-1.5 rounded-full bg-green-500/10 text-green-400 border border-green-500/20 flex items-center gap-1.5";
        
        db.collection('players').onSnapshot(snap => {
          if (snap.empty) seedDatabase();
          else {
            players = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderAll();
          }
        });

        db.collection('matches').orderBy('date', 'desc').onSnapshot(snap => {
          matches = snap.docs.map(doc => doc.data());
          renderHistory();
        });
      } catch (err) {
        console.error(err);
        useLocalStorage();
      }
    }

    function useLocalStorage() {
      document.getElementById('syncStatus').innerHTML = `<span class="w-2 h-2 rounded-full bg-blue-400"></span> Local Storage`;
      document.getElementById('syncStatus').className = "text-xs font-semibold px-3 py-1.5 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20 flex items-center gap-1.5";
      players = JSON.parse(localStorage.getItem('cr_players')) || defaultPlayers;
      matches = JSON.parse(localStorage.getItem('cr_matches')) || [];
      renderAll();
      renderHistory();
    }

    function seedDatabase() {
      defaultPlayers.forEach(p => db.collection('players').doc(p.id).set(p));
    }

    function renderAll() {
      players.sort((a, b) => b.pts - a.pts);
      renderPodium();
      renderLeaderboard();
      updateDropdowns();
    }

    function renderPodium() {
      const podium = document.getElementById('topPodium');
      podium.innerHTML = '';
      const top3 = players.slice(0, 3);
      top3.forEach((p, idx) => {
        const medals = ['🥇', '🥈', '🥉'];
        podium.innerHTML += `
          <div class="bg-gray-900 border border-gray-800 p-4 rounded-2xl flex items-center gap-4">
            <span class="text-3xl">${medals[idx] || '🏅'}</span>
            <div>
              <div class="text-xs text-gray-400">Rank #${idx + 1}</div>
              <div class="font-bold text-white text-base">${p.name}</div>
              <div class="text-xs font-semibold text-red-400">${p.pts} pts</div>
            </div>
          </div>
        `;
      });
    }

    function renderLeaderboard() {
      const tbody = document.getElementById('leaderboardBody');
      tbody.innerHTML = '';
      players.forEach((p, idx) => {
        const total = p.w + p.l;
        const winPct = total > 0 ? Math.round((p.w / total) * 100) : 0;
        tbody.innerHTML += `
          <tr class="hover:bg-gray-800/30 transition">
            <td class="p-4 font-bold text-gray-400">#${idx + 1}</td>
            <td class="p-4 font-bold text-white">${p.name}</td>
            <td class="p-4 text-center font-extrabold text-red-400">${p.pts}</td>
            <td class="p-4 text-center text-gray-300">${p.w} - ${p.l}</td>
            <td class="p-4 text-center text-gray-400">${winPct}%</td>
          </tr>
        `;
      });
    }

    function updateDropdowns() {
      const wSel = document.getElementById('winnerSelect');
      const lSel = document.getElementById('loserSelect');
      wSel.innerHTML = '';
      lSel.innerHTML = '';
      players.forEach(p => {
        wSel.innerHTML += `<option value="${p.id}">${p.name}</option>`;
        lSel.innerHTML += `<option value="${p.id}">${p.name}</option>`;
      });
      if (players.length > 1) lSel.selectedIndex = 1;
    }

    function renderHistory() {
      const hList = document.getElementById('historyList');
      hList.innerHTML = matches.length === 0 ? '<p class="text-center text-gray-500 text-sm py-8">No matches recorded yet.</p>' : '';
      matches.forEach(m => {
        hList.innerHTML += `
          <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl flex justify-between items-center text-sm">
            <div>
              <span class="font-bold text-green-400">${m.winnerName}</span>
              <span class="text-gray-400 font-bold mx-1.5">${m.winnerScore} - ${m.loserScore}</span>
              <span class="text-gray-400">${m.loserName}</span>
            </div>
            <span class="text-xs text-gray-500">${new Date(m.date).toLocaleDateString()}</span>
          </div>
        `;
      });
    }

    function addNewPlayer() {
      const name = document.getElementById('newPlayerName').value.trim();
      if (!name) return;
      const newP = { id: Date.now().toString(), name: name, pts: 1200, w: 0, l: 0 };
      if (db) db.collection('players').doc(newP.id).set(newP);
      else {
        players.push(newP);
        localStorage.setItem('cr_players', JSON.stringify(players));
        renderAll();
      }
      document.getElementById('newPlayerName').value = '';
    }

    function submitMatch() {
      const wId = document.getElementById('winnerSelect').value;
      const lId = document.getElementById('loserSelect').value;
      const wScore = parseInt(document.getElementById('winnerScore').value);
      const lScore = parseInt(document.getElementById('loserScore').value);

      if (wId === lId) { alert("Winner and Loser cannot be the same!"); return; }

      const winner = players.find(p => p.id === wId);
      const loser = players.find(p => p.id === lId);

      // Elo Rating Calculation
      const K = 32;
      const expectedW = 1 / (1 + Math.pow(10, (loser.pts - winner.pts) / 400));
      const expectedL = 1 / (1 + Math.pow(10, (winner.pts - loser.pts) / 400));
      
      winner.pts = Math.round(winner.pts + K * (1 - expectedW));
      loser.pts = Math.round(loser.pts + K * (0 - expectedL));
      winner.w += 1;
      loser.l += 1;

      const matchObj = {
        winnerName: winner.name,
        loserName: loser.name,
        winnerScore: wScore,
        loserScore: lScore,
        date: new Date().toISOString()
      };

      if (db) {
        db.collection('players').doc(winner.id).update({ pts: winner.pts, w: winner.w });
        db.collection('players').doc(loser.id).update({ pts: loser.pts, l: loser.l });
        db.collection('matches').add(matchObj);
      } else {
        matches.unshift(matchObj);
        localStorage.setItem('cr_players', JSON.stringify(players));
        localStorage.setItem('cr_matches', JSON.stringify(matches));
        renderAll();
        renderHistory();
      }
      switchTab('leaderboard');
    }
  </script>
</body>
</html>
